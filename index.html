<!DOCTYPE html>
<html lang="kk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BILIM+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
         :root {
            box-sizing: border-box;
            --bg: #0B0A1C;
            --surface: #161331;
            --surface-2: #1F1B42;
            --ink: #F3F1FF;
            --ink-soft: #A9A3D6;
            --line: #2E2860;
            --primary: #8B6CF2;
            --primary-ink: #0B0A1C;
            --primary-soft: #291F5E;
            --accent: #35D8F0;
            --accent-soft: #123742;
            --success: #3ADC8E;
            --success-soft: #0F3527;
            --danger: #FF5C77;
            --danger-soft: #3A1330;
            --stem: #8B6CF2;
            --hum: #F0A24E;
            --lang: #3ADC8E;
            --radius-s: 10px;
            --radius-m: 16px;
            --radius-l: 26px;
            --shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 8px 24px rgba(0, 0, 0, .35);
            --glow: 0 0 0 1px rgba(139, 108, 242, .35), 0 10px 36px rgba(139, 108, 242, .28);
            --glow-accent: 0 0 0 1px rgba(53, 216, 240, .3), 0 10px 30px rgba(53, 216, 240, .22);
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        
         :root[data-theme="light"] {
            --bg: #F6F5F1;
            --surface: #FFFFFF;
            --surface-2: #EFEEE7;
            --ink: #16171F;
            --ink-soft: #585A6B;
            --line: #E2E0D6;
            --primary: #4B3AE0;
            --primary-ink: #FFFFFF;
            --primary-soft: #ECE9FD;
            --accent: #FF8A3D;
            --accent-soft: #FFE9D6;
            --success: #1E9D63;
            --success-soft: #DEF3E6;
            --danger: #E0433B;
            --danger-soft: #FBE0DE;
            --stem: #4B3AE0;
            --hum: #C25B2E;
            --lang: #1E9D63;
            --shadow: 0 1px 2px rgba(22, 23, 31, .04), 0 8px 24px rgba(22, 23, 31, .06);
            --glow: var(--shadow);
            --glow-accent: var(--shadow);
        }
        
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }
        
        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }
        
        html,
        body {
            height: 100%;
        }
        
        body {
            margin: 0;
            color: var(--ink);
            background: radial-gradient(760px 420px at 12% -6%, rgba(139, 108, 242, .28), transparent 60%), radial-gradient(680px 420px at 100% 10%, rgba(53, 216, 240, .14), transparent 55%), var(--bg);
            background-attachment: fixed;
            font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }
        
        h1,
        h2,
        h3,
        .display {
            font-family: "Unbounded", "Manrope", sans-serif;
            margin: 0;
            letter-spacing: -0.01em;
        }
        
        p {
            margin: 0;
        }
        
        button {
            font-family: inherit;
        }
        
        a {
            color: inherit;
            text-decoration: none;
        }
        
        img {
            max-width: 100%;
            display: block;
        }
        
        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
         ::selection {
            background: var(--primary);
            color: var(--primary-ink);
        }
        
         :focus-visible {
            outline: 2.5px solid var(--primary);
            outline-offset: 2px;
            border-radius: 6px;
        }
        /* ---------- NAV ---------- */
        
        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            background: var(--bg);
            padding-top: env(safe-area-inset-top, 0px);
            border-bottom: 1px solid var(--line);
        }
        
        .topbar-inner {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 14px 20px;
            max-width: 1120px;
            margin: 0 auto;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-family: "Unbounded";
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .brand .mark {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0B0A1C;
            font-size: 15px;
            flex-shrink: 0;
            box-shadow: var(--glow);
        }
        
        .navlinks {
            display: flex;
            gap: 4px;
            margin-left: 8px;
        }
        
        .navlinks a {
            padding: 9px 13px;
            border-radius: 99px;
            font-weight: 600;
            font-size: 14.5px;
            color: var(--ink-soft);
            transition: background .15s, color .15s;
        }
        
        .navlinks a:hover {
            background: var(--surface-2);
            color: var(--ink);
        }
        
        .navlinks a.active {
            background: var(--primary-soft);
            color: var(--primary);
        }
        
        .top-spacer {
            flex: 1;
        }
        
        .langsel {
            display: flex;
            gap: 2px;
            background: var(--surface-2);
            border-radius: 99px;
            padding: 3px;
        }
        
        .langsel button {
            border: none;
            background: transparent;
            padding: 7px 11px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            color: var(--ink-soft);
        }
        
        .langsel button.active {
            background: var(--surface);
            color: var(--ink);
            box-shadow: var(--shadow);
        }
        
        .hamburger {
            display: none;
            border: none;
            background: var(--surface-2);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        
        .hamburger span,
        .hamburger span::before,
        .hamburger span::after {
            content: "";
            display: block;
            width: 16px;
            height: 2px;
            background: var(--ink);
            border-radius: 2px;
            position: relative;
        }
        
        .hamburger span::before {
            position: absolute;
            top: -5px;
        }
        
        .hamburger span::after {
            position: absolute;
            top: 5px;
        }
        
        .mobilemenu {
            display: none;
            flex-direction: column;
            gap: 2px;
            padding: 8px 20px 16px;
        }
        
        .mobilemenu a {
            padding: 11px 13px;
            border-radius: 10px;
            font-weight: 600;
            color: var(--ink-soft);
        }
        
        .mobilemenu a.active {
            background: var(--primary-soft);
            color: var(--primary);
        }
        
        @media (max-width:840px) {
            .navlinks {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .mobilemenu.open {
                display: flex;
            }
        }
        /* ---------- BUTTONS ---------- */
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            border-radius: 99px;
            padding: 13px 22px;
            font-size: 15px;
            transition: transform .12s, box-shadow .12s, background .15s;
        }
        
        .btn:active {
            transform: scale(.97);
        }
        
        .btn-primary {
            background: var(--primary);
            color: var(--primary-ink);
        }
        
        .btn-primary:hover {
            box-shadow: var(--glow);
        }
        
        .btn-accent {
            background: var(--accent);
            color: #241200;
        }
        
        .btn-ghost {
            background: var(--surface);
            color: var(--ink);
            border: 1.5px solid var(--line);
        }
        
        .btn-ghost:hover {
            border-color: var(--primary);
        }
        
        .btn-sm {
            padding: 9px 16px;
            font-size: 13.5px;
        }
        
        .btn-block {
            width: 100%;
        }
        
        .btn[disabled] {
            opacity: .45;
            cursor: not-allowed;
        }
        
        .btn-danger {
            background: var(--danger-soft);
            color: var(--danger);
        }
        /* ---------- HERO ---------- */
        
        .hero {
            padding: 64px 0 40px;
        }
        
        .hero-grid {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 40px;
            align-items: center;
        }
        
        @media (max-width:860px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .eyebrow-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--primary-soft);
            color: var(--primary);
            padding: 7px 14px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 18px;
        }
        
        .hero h1 {
            font-size: clamp(34px, 5.4vw, 58px);
            font-weight: 700;
            line-height: 1.03;
        }
        
        .hero h1 .line2 {
            color: var(--primary);
        }
        
        .hero p.sub {
            margin-top: 18px;
            font-size: 17px;
            color: var(--ink-soft);
            max-width: 46ch;
        }
        
        .hero-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        
        .hero-visual {
            width: 100%;
            max-width: 440px;
            justify-self: end;
        }
        
        .home-launch-panel {
            padding: 24px;
            border: 1px solid var(--line);
            border-top: 3px solid var(--accent);
            border-radius: var(--radius-m);
            background: linear-gradient(145deg, var(--surface), var(--surface-2));
            box-shadow: var(--shadow);
            animation: home-rise .45s ease-out both;
        }
        
        @keyframes home-rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .home-launch-top,
        .home-launch-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        
        .home-launch-kicker {
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }
        
        .home-launch-mark {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 18px;
        }
        
        .home-launch-title {
            margin-top: 18px;
            font-size: 20px;
        }
        
        .home-launch-copy {
            margin: 7px 0 18px;
            color: var(--ink-soft);
            font-size: 14px;
        }
        
        .home-launch-panel label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
        }
        
        .home-launch-panel .btn {
            margin-top: 12px;
        }
        
        .home-launch-meta {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
            color: var(--ink-soft);
            font-size: 12px;
        }
        
        .home-launch-meta strong {
            color: var(--ink);
            font-family: "Unbounded";
            font-size: 14px;
        }
        
        .stats-strip {
            display: flex;
            gap: 0;
            margin-top: 56px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            padding: 22px 0;
        }
        
        .stats-strip .stat {
            flex: 1;
            text-align: center;
            border-right: 1px solid var(--line);
        }
        
        .stats-strip .stat:last-child {
            border-right: none;
        }
        
        .stats-strip .num {
            font-family: "Unbounded";
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .stats-strip .lab {
            font-size: 12.5px;
            color: var(--ink-soft);
            margin-top: 3px;
        }
        /* ---------- SECTIONS ---------- */
        
        section {
            padding: 52px 0;
        }
        
        .section-head {
            margin-bottom: 26px;
        }
        
        .section-head h2 {
            font-size: 26px;
            font-weight: 700;
        }
        
        .section-head p {
            color: var(--ink-soft);
            margin-top: 6px;
            font-size: 15px;
        }
        /* grade chips */
        
        .chiprow {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .chip {
            border: 1.5px solid var(--line);
            background: var(--surface);
            padding: 11px 20px;
            border-radius: 99px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }
        
        .chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--primary-ink);
        }
        
        .chip:hover:not(.active) {
            border-color: var(--primary);
        }
        /* subject grid */
        
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 14px;
        }
        
        .subj-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 4px solid var(--cat, var(--primary));
            border-radius: var(--radius-m);
            padding: 18px;
            cursor: pointer;
            transition: transform .12s, box-shadow .12s;
        }
        
        .subj-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow);
        }
        
        .subj-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .subj-icon {
            font-size: 26px;
        }
        
        .subj-cat-tag {
            font-size: 10.5px;
            font-weight: 700;
            color: var(--cat, var(--primary));
            background: color-mix(in srgb, var(--cat, var(--primary)) 14%, transparent);
            padding: 4px 8px;
            border-radius: 99px;
        }
        
        .subj-name {
            font-weight: 700;
            font-size: 16px;
            margin-top: 14px;
        }
        
        .subj-prog-track {
            height: 6px;
            background: var(--surface-2);
            border-radius: 99px;
            margin-top: 14px;
            overflow: hidden;
        }
        
        .subj-prog-fill {
            height: 100%;
            background: var(--cat, var(--primary));
            border-radius: 99px;
        }
        
        .subj-prog-lab {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 6px;
        }
        /* how it works */
        
        .how-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        
        @media (max-width:760px) {
            .how-grid {
                grid-template-columns: 1fr 1fr;
            }
            .hero-visual {
                max-width: 600px;
                justify-self: start;
            }
        }
        
        @media (max-width:480px) {
            .how-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .how-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-m);
            padding: 20px;
        }
        
        .how-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: var(--primary-soft);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 12px;
        }
        
        .how-title {
            font-weight: 700;
            font-size: 15px;
        }
        
        .how-desc {
            color: var(--ink-soft);
            font-size: 13.5px;
            margin-top: 5px;
        }
        
        footer {
            border-top: 1px solid var(--line);
            padding: 30px 0;
            color: var(--ink-soft);
            font-size: 13px;
            text-align: center;
        }
        /* ---------- SUBJECT PAGE ---------- */
        
        .subj-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 8px;
        }
        
        .subj-header .ic {
            font-size: 38px;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .crumb {
            color: var(--ink-soft);
            font-size: 13.5px;
            margin-bottom: 16px;
        }
        
        .crumb span {
            cursor: pointer;
        }
        
        .crumb span:hover {
            color: var(--primary);
        }
        
        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 22px;
        }
        
        .topic-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-m);
            padding: 16px 18px;
        }
        
        .topic-name {
            font-weight: 700;
            flex: 1;
        }
        
        .topic-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 99px;
        }
        
        .badge-ready {
            background: var(--success-soft);
            color: var(--success);
        }
        
        .badge-soon {
            background: var(--surface-2);
            color: var(--ink-soft);
        }
        
        .topic-track {
            width: 110px;
            height: 6px;
            background: var(--surface-2);
            border-radius: 99px;
            overflow: hidden;
        }
        
        .topic-fill {
            height: 100%;
            background: var(--primary);
        }
        
        @media (max-width:640px) {
            .topic-row {
                flex-wrap: wrap;
            }
            .topic-name {
                flex-basis: calc(100% - 16px);
            }
            .topic-track {
                width: 100%;
            }
        }
        /* ---------- FORMS / SETUP CARD ---------- */
        
        .setup-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-l);
            padding: 28px;
            max-width: 640px;
        }
        
        .field {
            margin-bottom: 20px;
        }
        
        .field label {
            display: block;
            font-weight: 700;
            font-size: 13.5px;
            margin-bottom: 9px;
            color: var(--ink-soft);
        }
        
        .seg {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .seg button {
            flex: 1;
            min-width: 90px;
            border: 1.5px solid var(--line);
            background: var(--surface);
            padding: 11px;
            border-radius: var(--radius-s);
            font-weight: 700;
            cursor: pointer;
            font-size: 13.5px;
        }
        
        .seg button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--primary-ink);
        }
        
        .seg button[disabled] {
            opacity: .35;
            cursor: not-allowed;
        }
        
        input[type=text],
        input[type=number],
        select,
        textarea {
            width: 100%;
            border: 1.5px solid var(--line);
            background: var(--bg);
            color: var(--ink);
            padding: 12px 14px;
            border-radius: var(--radius-s);
            font-size: 15px;
            font-family: inherit;
        }
        
        textarea {
            resize: vertical;
            min-height: 70px;
        }
        
        .helptext {
            font-size: 12.5px;
            color: var(--ink-soft);
            margin-top: 6px;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--ink-soft);
        }
        
        .empty-state .big {
            font-size: 40px;
            margin-bottom: 10px;
        }
        /* ---------- QUESTION SCREEN ---------- */
        
        .q-wrap {
            max-width: 680px;
            margin: 0 auto;
        }
        
        .q-progbar {
            height: 8px;
            background: var(--surface-2);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 22px;
        }
        
        .q-progfill {
            height: 100%;
            background: var(--primary);
            transition: width .25s;
        }
        
        .q-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--ink-soft);
            margin-bottom: 14px;
            font-weight: 700;
        }
        
        .q-difftag {
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 11px;
            background: var(--accent-soft);
            color: var(--accent);
        }
        
        .q-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-l);
            padding: 26px;
            box-shadow: var(--glow);
        }
        
        .q-prompt {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 22px;
        }
        
        .opt {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1.5px solid var(--line);
            border-radius: var(--radius-s);
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .opt:hover {
            border-color: var(--primary);
        }
        
        .opt.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        
        .opt.correct {
            border-color: var(--success);
            background: var(--success-soft);
        }
        
        .opt.incorrect {
            border-color: var(--danger);
            background: var(--danger-soft);
        }
        
        .opt-mark {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1.5px solid var(--line);
            flex-shrink: 0;
        }
        
        .opt.selected .opt-mark {
            background: var(--primary);

        /* ============================== STATE ============================== */
        const STORE_KEY = 'bilimplus_v1';

        function defaultState() {
            return {
                lang: 'kk',
                profile: {
                    name: '',
                    grade: null,
                    favorites: []
                },
                progress: {}, // `${subj}:${topic}` -> {correct,total,lastDiff}
                sessions: [], // {id,date,subject,topic,mode,correct,total,timeSec}
                custom: {
                    questions: {}
                }, // bank -> [customQ]
            };
        }
        let STATE = loadState();

        function loadState() {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                if (!raw) return defaultState();
                const parsed = JSON.parse(raw);
                return Object.assign(defaultState(), parsed, {
                    profile: Object.assign(defaultState().profile, parsed.profile || {}),
                    progress: parsed.progress || {},
                    sessions: parsed.sessions || [],
                    custom: Object.assign({
                        questions: {}
                    }, parsed.custom || {}),
                });
            } catch (e) {
                return defaultState();

let setupDiff='all', setupCount=5;
function selSeg(groupId, btn, varName){
  if(btn.disabled) return;
    const v = btn.getAttribute('data-d');
    if(varName==='setupDiff'){
        setupDiff=v;
        const route=currentRoute();

        render();
        return;
    }
  document.querySelectorAll('#'+groupId+' button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
    setupCount=parseInt(v,10);
}
function availableDiffs(bank){
  const s = new Set(bank.map(q=>q.diff));
  return ['easy','medium','hard','olympiad'].filter(d=>s.has(d));
}
function emptyState(icon,title,body,actions){
  return `<div class="empty-state"><div class="big">${icon}</div><h3 style="font-size:18px;margin-bottom:8px;">${title}</h3>${body?`<p>${body}</p>`:''}${actions?`<div style="margin-top:18px;">${actions}</div>`:''}</div>`;
}
function getBank(bankKey){
  const built = QUESTIONS[bankKey] || [];
  const custom = (STATE.custom.questions[bankKey]||[]);
    return built.length || custom.length ? built.concat(custom) : buildGuidedBank(bankKey);
}

function buildGuidedBank(bankKey){
    const [subjId, topicId] = bankKey.split(':');
    const topic = TOPIC_I18N[topicId];
    if(!topic || !SUBJECTS.some(subject=>subject.id===subjId)) return [];
    const otherTopics = (TOPICS[subjId]||[])
        .filter(item=>item.id!==topicId)
        .map(item=>TOPIC_I18N[item.id])
        .filter(Boolean);
    const langs = ['kk','ru','en'];
    const explanation = Object.fromEntries(langs.map(lang=>[lang,tfLang('guidedChoiceExplanation',lang,{})]));
    const makeChoice = (index, diff, promptKey)=>{
        const options = shuffle([topic,...shuffle(otherTopics).slice(0,3)]);
        return {
            id:`guided-${topicId}-choice-${index}`,
            type:'single', diff,
            prompt:Object.fromEntries(langs.map(lang=>[lang,tfLang(promptKey,lang,{})])),
            options,
            correct:options.indexOf(topic),
            expl:explanation,
        };
    };
    const makeTrueFalse = (index, statementTopic, isCurrent)=>({
        id:`guided-${topicId}-tf-${index}`,
        type:'truefalse', diff:'easy',
        prompt:Object.fromEntries(langs.map(lang=>[lang,tfLang('guidedStatementPrompt',lang,{topic:statementTopic[lang]||statementTopic.kk})])),
        correct:isCurrent,
        expl:explanation,
    });
    const makeWritten = (index, diff, promptKey)=>({
        id:`guided-${topicId}-written-${index}`,
        type:'guided', diff,
        prompt:Object.fromEntries(langs.map(lang=>[lang,tfLang(promptKey,lang,{topic:topic[lang]||topic.kk})])),
        expl:{
            kk:'Жауабыңды оқулықтағы анықтамамен немесе сабақ жазбасымен салыстыр. Нақты мысал мен негізгі терминдерді қос.',
            ru:'Сравни ответ с учебником или конспектом. Проверь, что указал ключевые термины и конкретный пример.',
            en:'Compare your response with your textbook or notes. Check that it includes the key terms and a concrete example.',
        },
    });
    const easy = [
        makeChoice(1,'easy','guidedChoicePrompt1'),
        makeChoice(2,'easy','guidedChoicePrompt2'),
        makeChoice(3,'easy','guidedChoicePrompt3'),
        makeTrueFalse(1,topic,true),
        makeTrueFalse(2,shuffle(otherTopics)[0],false),
    ];
    const medium = [
        makeChoice(4,'medium','guidedChoicePrompt1'),
        {...makeTrueFalse(3,shuffle(otherTopics)[0],false),diff:'medium'},
        makeWritten(1,'medium','guidedPromptPurpose'),
        makeWritten(2,'medium','guidedPromptRelation'),
        makeWritten(3,'medium','guidedPromptExample'),
    ];
    const hard = [
        makeWritten(4,'hard','guidedPromptDefine'),
        makeWritten(5,'hard','guidedPromptPurpose'),
        makeWritten(6,'hard','guidedPromptRelation'),
        makeWritten(7,'hard','guidedPromptExample'),
        makeWritten(8,'hard','guidedPromptRecall'),
    ];
    return [...easy,...medium,...hard];
}

function tfLang(key, lang, vars){
    let text = T[key]?.[lang] || key;
    for(const name in vars) text = text.replaceAll(`{${name}}`, vars[name]);
    return text;
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function toWrittenQuestion(question){
    if(question.type==='guided'||question.type==='text') return {...question};
    const answerByLang=Object.fromEntries(['kk','ru','en'].map(lang=>{
        let answer='';
        if(question.type==='single') answer=question.options[question.correct][lang];
        else if(question.type==='truefalse') answer=question.correct?({kk:'Ақиқат',ru:'Верно',en:'True'})[lang]:({kk:'Жалған',ru:'Неверно',en:'False'})[lang];
        else if(question.type==='numeric') answer=String(question.correct)+(question.unit||'');
        else if(question.type==='multi') answer=question.correctMulti.map(i=>question.options[i][lang]).join(', ');
        else if(question.type==='matching') answer=question.pairs.map(pair=>`${pair.left[lang]} → ${pair.right[lang]}`).join('; ');
        else if(question.type==='ordering') answer=question.items.map(item=>item[lang]).join(' → ');
        return [lang,answer];
    }));
    return {...question,type:'text',answerByLang,accept:Object.values(answerByLang)};
}

function launchPractice(subjId, topicId){
  const bankKey = subjId+':'+topicId;
  let pool = getBank(bankKey);
  if(setupDiff!=='all') pool = pool.filter(q=>q.diff===setupDiff);
  if(pool.length===0) pool = getBank(bankKey);
    if(setupDiff==='hard') pool = pool.map(toWrittenQuestion);
    const guided = pool.some(q=>q.type==='guided');
    if(guided) setupCount = Math.min(setupCount,pool.length);
    let qs = shuffle(pool);
  while(qs.length < setupCount) qs = qs.concat(shuffle(pool));
  qs = qs.slice(0, setupCount);
  SESSION = {
        mode:qs.some(q=>q.type==='guided')?'guided':'practice', subjId, topicId, bankKey,
        questions: qs.map(q=>({...q, given:null, submitted:false, correctFlag:null, marked:false})),
    index:0, startTime:Date.now(), timeLimitSec:null,
  };
  go('session');
}

/* ============================== QUESTION SESSION ============================== */
function currentQ(){ return SESSION.questions[SESSION.index]; }

function viewSession(){
  if(!SESSION) return `<div class="container">${emptyState('🤔', t('chooseSubjFirst'))}</div>`;
  const q = currentQ();
  const total = SESSION.questions.length;
  const pct = Math.round((SESSION.index)/total*100);
    const answered = q.correctFlag !== null || q.submitted===true;

  let body = '';
    if(q.type==='single' || q.type==='truefalse'){
    body = renderChoiceOptions(q, answered, false);
  } else if(q.type==='multi'){
    body = renderChoiceOptions(q, answered, true);
  } else if(q.type==='numeric'){
    body = renderNumeric(q, answered);
  } else if(q.type==='text'){
    body = renderTextAnswer(q, answered);
    } else if(q.type==='guided'){
        body = renderGuided(q, answered);
  } else if(q.type==='matching'){
    body = renderMatching(q, answered);
  } else if(q.type==='ordering'){
    body = renderOrdering(q, answered);
  }

  const feedback = answered ? renderFeedback(q) : '';
  const isOlympiad = SESSION.mode==='olympiad';

  return `<div class="q-wrap">
    ${isOlympiad ? olympiadTopBar() : ''}
    <div class="q-progbar"><div class="q-progfill" style="width:${pct}%"></div></div>
    <div class="q-meta"><span>${t('questionOf')} ${SESSION.index+1}/${total}</span><span class="q-difftag">${t('diff_'+q.diff)}</span></div>
    <div class="q-card">
      <div class="q-prompt">${q.prompt[L()]}</div>
      <div id="qBody">${body}</div>
      ${feedback}
    </div>
    <div class="q-actions">
      ${isOlympiad ? `<button class="btn btn-ghost" onclick="toggleMark()">${q.marked?t('unmark'):t('markReview')}</button>` : ''}
      ${!answered ? `<button class="btn btn-primary" id="submitBtn" onclick="submitCurrent()" ${needsSelectionDisabled(q)?'disabled':''}>${t('submitAnswer')}</button>`
        : `<button class="btn btn-primary" onclick="${SESSION.index<total-1?'nextQuestion()':'finishSession()'}">${SESSION.index<total-1?t('continueBtn'):t('seeResults')}</button>`}
    </div>
    ${isOlympiad ? olympiadSidebarBelow() : ''}
  </div>`;
}
function needsSelectionDisabled(q){ return false; }

function renderChoiceOptions(q, answered, isMulti){
  const given = q.given;
    const options = q.type==='truefalse'
        ? [
                {kk:'Ақиқат',ru:'Верно',en:'True'},
                {kk:'Жалған',ru:'Неверно',en:'False'},
            ]
        : q.options;
    return options.map((opt,i)=>{
    let cls='opt';
        const optionValue = q.type==='truefalse' ? i===0 : i;
        const selected = isMulti ? (given && given.includes(i)) : (given===optionValue);
    if(selected) cls+=' selected';
    if(answered){
            const isCorrect = isMulti ? (q.correctMulti.includes(i)) : (q.type==='truefalse' ? optionValue===q.correct : i===q.correct);
      if(isCorrect) cls+=' correct';
      else if(selected && !isCorrect) cls+=' incorrect';
    }
        return `<div class="${cls}" onclick="${answered?'':(isMulti?`toggleMultiOpt(${i})`:`selectOpt(${q.type==='truefalse'?optionValue:i})`)}">
      <div class="opt-mark"></div><div>${opt[L()]}</div>
    </div>`;
  }).join('');
}
function selectOpt(i){ currentQ().given = i; render_qBody(); }
function toggleMultiOpt(i){
  const q=currentQ(); if(!Array.isArray(q.given)) q.given=[];
  const idx=q.given.indexOf(i);
  if(idx>=0) q.given.splice(idx,1); else q.given.push(i);
  render_qBody();
}
function renderNumeric(q, answered){
  return `<input type="number" id="numInput" placeholder="${t('numberPh')}" value="${q.given!==null&&q.given!==undefined?q.given:''}" ${answered?'disabled':''} oninput="currentQ().given=this.value===''?null:parseFloat(this.value)">`;
}
function renderTextAnswer(q, answered){
    return `<textarea id="textInput" rows="4" maxlength="1200" placeholder="${t('yourAnswerPh')}" ${answered?'disabled':''} oninput="currentQ().given=this.value">${esc(q.given||'')}</textarea>`;
}
function renderGuided(q, answered){
    return `<textarea rows="5" maxlength="1200" placeholder="${t('guidedAnswerPlaceholder')}" ${answered?'disabled':''} oninput="currentQ().given=this.value">${esc(q.given||'')}</textarea>`;
}
function renderMatching(q, answered){
  if(!q.given) q.given = new Array(q.pairs.length).fill(null);
  const rightShuffled = q._rightOrder || (q._rightOrder = shuffle(q.pairs.map((p,i)=>i)));
  return q.pairs.map((p,i)=>{
    return `<div class="match-row">
      <div style="font-weight:700;">${p.left[L()]}</div>
      <select ${answered?'disabled':''} onchange="setMatch(${i}, this.value)">
        <option value="">${t('selectPh')}</option>
        ${rightShuffled.map(ri=>`<option value="${ri}" ${q.given[i]==ri?'selected':''}>${q.pairs[ri].right[L()]}</option>`).join('')}
      </select>
    </div>`;
  }).join('');
}
function setMatch(i,val){ currentQ().given[i] = val===''?null:parseInt(val,10); }
function renderOrdering(q, answered){
  if(!q.given) q.given = shuffle(q.items.map((_,i)=>i));
  return q.given.map((itemIdx,pos)=>{
    return `<div class="order-item"><div class="num">${pos+1}</div><div style="flex:1;">${q.items[itemIdx][L()]}</div>
      ${answered?'':`<div class="order-btns">
        <button onclick="moveOrder(${pos},-1)" ${pos===0?'disabled':''}>↑</button>
        <button onclick="moveOrder(${pos},1)" ${pos===q.given.length-1?'disabled':''}>↓</button>
      </div>`}
    </div>`;
  }).join('');
}
function moveOrder(pos,dir){
  const q=currentQ(); const arr=q.given; const j=pos+dir;
  [arr[pos],arr[j]]=[arr[j],arr[pos]];
  render_qBody();
}
function render_qBody(){
  // re-render whole session view to keep state consistent (simple approach)
  const app=document.getElementById('app');
  const r=currentRoute();
  app.innerHTML = navHTML(r[0]) + `<div class="pagewrap">${viewSession()}</div>` + footerHTML();
}

function gradeQuestion(q){
    if(q.type==='guided') return null;
  if(q.type==='single' || q.type==='truefalse'){
    if(q.type==='truefalse'){ return q.given===q.correct; }
    return q.given===q.correct;
  }
  if(q.type==='multi'){
    const g=(q.given||[]).slice().sort();
    const c=q.correctMulti.slice().sort();
    return g.length===c.length && g.every((v,i)=>v===c[i]);
  }
  if(q.type==='numeric'){
    return q.given!==null && Math.abs(parseFloat(q.given)-q.correct) < 1e-6;
  }
  if(q.type==='text'){
    if(!q.given) return false;
    const norm = s=>s.toString().trim().toLowerCase();
    return q.accept.map(norm).includes(norm(q.given));
  }
  if(q.type==='matching'){
    if(!q.given) return false;
    return q.given.every((v,i)=>v===i);
  }
  if(q.type==='ordering'){
    if(!q.given) return false;
    return q.given.every((v,i)=>v===i);
  }
  return false;
}
function submitCurrent(){
  const q = currentQ();
    const hasAnswer = q.type==='guided' ? (typeof q.given==='string'&&q.given.trim().length>0)
        : q.type==='multi' ? (q.given && q.given.length>0)
    : q.type==='matching' ? (q.given && q.given.some(v=>v!==null))
    : q.type==='ordering' ? true
    : (q.given!==null && q.given!==undefined && q.given!=='');
  if(!hasAnswer){ showToast(t('yourAnswerPh')); return; }
    if(q.type==='guided') q.submitted=true;
    else q.correctFlag = gradeQuestion(q);
  render_qBody();
}
function renderFeedback(q){
  const ok = q.correctFlag;
    if(q.type==='guided'){
        return `<div class="feedback" style="background:var(--surface-2);">
            <div style="font-weight:800;">${t('guidedSubmitted')}</div>
            <div class="expl">${t('guidedNotAutoGraded')} ${q.expl[L()]}</div>
        </div>`;
    }
  let correctText = '';
  if(!ok){
    if(q.type==='single') correctText = q.options[q.correct][L()];
    else if(q.type==='truefalse') correctText = q.correct ? ({kk:'Ақиқат',ru:'Верно',en:'True'})[L()] : ({kk:'Жалған',ru:'Неверно',en:'False'})[L()];
    else if(q.type==='multi') correctText = q.correctMulti.map(i=>q.options[i][L()]).join(', ');
    else if(q.type==='numeric') correctText = q.correct + (q.unit||'');
    else if(q.type==='text') correctText = q.answerByLang?.[L()] || q.accept[0];
    else if(q.type==='matching') correctText = q.pairs.map(p=>p.left[L()]+' → '+p.right[L()]).join('; ');
    else if(q.type==='ordering') correctText = q.items.map(it=>it[L()]).join(' → ');
  }
  return `<div class="feedback ${ok?'ok':'bad'}">
    <div style="font-weight:800;">${ok?('✅ '+t('correctLbl')):('❌ '+t('incorrectLbl'))}</div>
    ${!ok?`<div style="margin-top:6px;"><strong>${t('correctAnswerIs')}:</strong> ${correctText}</div>`:''}
    <div class="expl"><strong>${t('explanationLbl')}:</strong> ${q.expl[L()]}</div>
  </div>`;
}
function nextQuestion(){ SESSION.index++; render_qBody(); }
function toggleMark(){ currentQ().marked = !currentQ().marked; render_qBody(); }

function finishSession(){
  const total = SESSION.questions.length;
    const objectiveQuestions = SESSION.questions.filter(q=>q.type!=='guided');
    const correct = objectiveQuestions.filter(q=>q.correctFlag===true).length;
    const incorrect = objectiveQuestions.filter(q=>q.correctFlag===false).length;
        const writtenAnswered = SESSION.questions.filter(q=>q.type==='guided'&&q.submitted===true).length;
    const unanswered = SESSION.questions.filter(q=>q.type==='guided'?!q.submitted:q.correctFlag===null).length;
    const complete = total-unanswered;
  const timeSec = Math.round((Date.now()-SESSION.startTime)/1000);

    const bankKey = SESSION.bankKey;
    if(SESSION.mode!=='guided'){
        const prev = STATE.progress[bankKey] || {correct:0,total:0};
        STATE.progress[bankKey] = {correct:prev.correct+correct, total:prev.total+total};
    }

  STATE.sessions.unshift({
    id:'s'+Date.now(), date:Date.now(), subjId:SESSION.subjId, topicId:SESSION.topicId,
    mode:SESSION.mode, correct, incorrect, writtenAnswered, total, timeSec,
  });
  STATE.sessions = STATE.sessions.slice(0,40);
  saveState();

    SESSION.result = {correct, total, unanswered, incorrect, complete, writtenAnswered, timeSec};
  go('results');
}

function ringSVG(pct){
  const r=62, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="150" height="150" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--primary)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 75 75)"/>
    <text x="75" y="82" text-anchor="middle" font-family="Unbounded" font-size="30" font-weight="700" fill="var(--ink)">${pct}%</text>
  </svg>`;
}

}

/* ============================== OLYMPIAD SETUP (WIZARD) ============================== */
// Step 1: grade -> Step 2: subject -> Step 3: olympiad set (year/stage, original vs official) -> Step 4: configure -> start
let olyStep = 1;
let olyGrade = STATE.profile.grade || 9;
let olySubj = null;
let olySetId = null;
let olyCount = 10, olyTime = 20;

function resetOlyWizard(){
  olyStep = 1; olyGrade = STATE.profile.grade || 9; olySubj = null; olySetId = null;
}
function goOlympiad(){ resetOlyWizard(); go('olysetup'); }

function getOlympiadSets(subjId, grade){
  const bankTopic = (TOPICS[subjId]||[]).find(tp=>tp.hasBank);
  const sets = [];
  if(bankTopic && grade >= (bankTopic.minGrade||7)){
    sets.push({id:subjId+'-practice-2025', kind:'original', year:2025, stage:'practice', topicId:bankTopic.id});
    sets.push({id:subjId+'-regional-2024', kind:'original', year:2024, stage:'regional', topicId:bankTopic.id});
  }
  sets.push({id:subjId+'-republican-official', kind:'official', year:2025, stage:'republican',
    link:'https://daryn.kz/kk/sample-page/'});
  return sets;
}
const STAGE_LABEL = {
  practice:{kk:'Жаттығу жинағы',ru:'Тренировочный сборник',en:'Practice set'},
  regional:{kk:'Облыстық кезең',ru:'Региональный этап',en:'Regional stage'},
  republican:{kk:'Республикалық олимпиада',ru:'Республиканская олимпиада',en:'Republican Olympiad'},
};

function viewOlySetup(){
  if(olyStep===1) return olyStepGrade();
  if(olyStep===2) return olyStepSubject();
  if(olyStep===3) return olyStepSet();
  return olyStepConfigure();
}
function olyWizardShell(stepNum, inner){
  const stepsLbl = [t('gradeLabel'), t('adminSubject'), ({kk:'Жинақ',ru:'Сборник',en:'Set'})[L()], ({kk:'Баптау',ru:'Настройка',en:'Configure'})[L()]];
  return `<div class="container" style="max-width:760px;">
    <div class="section-head"><h2>🏆 ${t('olympiadTitle')}</h2><p>${t('olympiadSub')}</p></div>
    <div class="chiprow" style="margin-bottom:24px;">
      ${stepsLbl.map((s,i)=>`<span class="chip" style="cursor:default;padding:8px 16px;font-size:13px;${i+1===stepNum?'':'opacity:.45;'}" ${i+1<stepNum?`onclick="olyStep=${i+1};render();"`:''}>${i+1}. ${s}</span>`).join('')}
    </div>
    ${inner}
  </div>`;
}
function olyStepGrade(){
  return olyWizardShell(1, `
    <div class="setup-card" style="max-width:none;">
      <div class="field"><label>${t('chooseGrade')}</label>
        <div class="chiprow">${GRADES.map(g=>`<button class="chip ${olyGrade===g?'active':''}" onclick="olyGrade=${g};render();">${g} ${t('gradeLabel')}</button>`).join('')}</div>
      </div>
      <button class="btn btn-accent btn-block" onclick="olyStep=2;render();">${t('continueBtn')}</button>
    </div>`);
}
function olyStepSubject(){
  return olyWizardShell(2, `
    <div class="subject-grid">
      ${SUBJECTS.map(s=>`<div class="subj-card" style="--cat:${CAT_VAR[s.cat]}" onclick="olySubj='${s.id}';olyStep=3;render();">
        <div class="subj-top"><div class="subj-icon">${s.icon}</div><div class="subj-cat-tag">${catLabel(s.cat)}</div></div>
        <div class="subj-name">${subjName(s.id,L())}</div>
      </div>`).join('')}
    </div>
    <div style="margin-top:20px;"><button class="btn btn-ghost" onclick="olyStep=1;render();">← ${t('gradeLabel')}</button></div>`);
}
function olyStepSet(){
  const sets = getOlympiadSets(olySubj, olyGrade);
  return olyWizardShell(3, `
    <div class="subj-header" style="margin-bottom:18px;">
      <div class="ic">${SUBJECTS.find(s=>s.id===olySubj).icon}</div>
      <div><h1 style="font-size:22px;">${subjName(olySubj,L())}</h1><p style="color:var(--ink-soft);font-size:13.5px;">${olyGrade} ${t('gradeLabel')}</p></div>
    </div>
    <div class="topic-list">
      ${sets.map(s=>{
        const isOfficial = s.kind==='official';
        const label = isOfficial ? t('sourceOfficial') : t('sourceOriginal');
        const badgeColor = isOfficial ? 'var(--accent)' : 'var(--success)';
        const title = `${s.year} · ${STAGE_LABEL[s.stage][L()]}`;
        return `<div class="topic-row" style="flex-wrap:wrap;">
          <div style="flex:1;min-width:180px;">
            <div class="topic-name">${title}</div>
            <div style="font-size:12px;margin-top:4px;color:${badgeColor};font-weight:700;">${isOfficial?'🔗':'✅'} ${label}</div>
          </div>
          ${isOfficial
            ? `<a class="btn btn-ghost btn-sm" href="${s.link}" target="_blank" rel="noopener">${({kk:'Daryn сайтында қарау',ru:'Открыть на Daryn',en:'View on Daryn'})[L()]}</a>`
            : `<button class="btn btn-primary btn-sm" onclick="olySetId='${s.id}';olyStep=4;render();">${t('continueBtn')}</button>`}
        </div>`;
      }).join('')}
    </div>
    <p class="helptext" style="margin-top:14px;">${({kk:'Ресми жинақтар Daryn сайтына сілтеме береді және Daryn сұрақтарын көшірмейді. BILIM+ жинақтары — біздің түпнұсқа тапсырмалар.',ru:'Официальные сборники ведут на сайт Daryn и не копируют их вопросы. Сборники BILIM+ — наши оригинальные задания.',en:'Official sets link out to Daryn and never reproduce their questions. BILIM+ sets are our own original tasks.'})[L()]}</p>
    <div style="margin-top:16px;"><button class="btn btn-ghost" onclick="olyStep=2;render();">← ${t('adminSubject')}</button></div>`);
}
function olyStepConfigure(){
  const [subjId, topicId] = (function(){
    const sets = getOlympiadSets(olySubj, olyGrade);
    const s = sets.find(x=>x.id===olySetId);
    return [olySubj, s?s.topicId:null];
  })();
  return olyWizardShell(4, `
    <div class="setup-card" style="max-width:none;">
      <div class="grid2">
        <div class="field">
          <label>${t('numQuestions')}</label>
          <div class="seg" id="olyCountSeg">${[10,20,30,40].map((n,i)=>`<button data-d="${n}" class="${i===0?'active':''}" onclick="selSeg('olyCountSeg',this,'olyCount')">${n}</button>`).join('')}</div>
        </div>
        <div class="field">
          <label>${t('timeLimitLbl')}</label>
          <div class="seg" id="olyTimeSeg">${[10,20,30,60].map((n,i)=>`<button data-d="${n}" class="${i===1?'active':''}" onclick="selSeg('olyTimeSeg',this,'olyTime')">${n} ${t('min')}</button>`).join('')}</div>
        </div>
      </div>
      <button class="btn btn-accent btn-block" onclick="launchOlympiad('${subjId}','${topicId}')">${t('startOlympiad')}</button>
    </div>
    <div style="margin-top:16px;"><button class="btn btn-ghost" onclick="olyStep=3;render();">← ${({kk:'Жинақ',ru:'Сборник',en:'Set'})[L()]}</button></div>`);
}
function launchOlympiad(subjId, topicId){
  const bankKey = subjId+':'+topicId;
  let pool = getBank(bankKey);
  let qs = shuffle(pool);
  while(qs.length<olyCount) qs = qs.concat(shuffle(pool));
  qs = qs.slice(0, olyCount);
  SESSION = {
    mode:'olympiad', subjId, topicId, bankKey,
    questions: qs.map(q=>({...q, given:null, correctFlag:null, marked:false})),
    index:0, startTime:Date.now(), timeLimitSec: olyTime*60, endsAt: Date.now()+olyTime*60*1000,
  };
  go('session');
  startOlyTimer();
}
let olyTimerHandle = null;
function startOlyTimer(){
  clearInterval(olyTimerHandle);
  olyTimerHandle = setInterval(()=>{
    if(!SESSION || SESSION.mode!=='olympiad' || location.hash.indexOf('session')<0){ clearInterval(olyTimerHandle); return; }
    const remain = Math.max(0, Math.round((SESSION.endsAt-Date.now())/1000));
    const el = document.getElementById('olyTimerVal');
    if(el){ el.textContent = fmtTime(remain); el.classList.toggle('low', remain<60); }
    if(remain<=0){
      clearInterval(olyTimerHandle);
      showToast(t('autoFinished'));
      finishSession();
    }
  }, 1000);
}
function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function olympiadTopBar(){
  const remain = Math.max(0, Math.round((SESSION.endsAt-Date.now())/1000));
  return `<div class="oly-top">
    <div><strong>${subjName(SESSION.subjId,L())}</strong> · ${TOPIC_I18N[SESSION.topicId][L()]} 🏆</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:12.5px;color:var(--ink-soft);">${t('remainingTime')}</span>
      <span class="timer ${remain<60?'low':''}" id="olyTimerVal">${fmtTime(remain)}</span>
      <button class="btn btn-danger btn-sm" onclick="confirmFinish()">${t('finishTest')}</button>
    </div>
  </div>`;
}
function confirmFinish(){ if(confirm(t('finishConfirm'))){ clearInterval(olyTimerHandle); finishSession(); } }
function olympiadSidebarBelow(){
  return `<div class="panel" style="margin-top:20px;">
    <h3>${t('questionOf')}</h3>
    <div class="navgrid">
      ${SESSION.questions.map((q,i)=>{
        let cls='';
        if(i===SESSION.index) cls+=' cur';
        if(q.marked) cls+=' mark';
        else if(q.correctFlag!==null) cls+=' ans';
        return `<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
      }).join('')}
    </div>
    <div class="legend">
      <div class="row"><span class="sw" style="background:var(--success-soft);border:1px solid var(--success);"></span>${t('legendAnswered')}</div>
      <div class="row"><span class="sw" style="background:var(--accent-soft);border:1px solid var(--accent);"></span>${t('legendMarked')}</div>
      <div class="row"><span class="sw" style="background:var(--surface);border:1.5px solid var(--primary);"></span>${t('legendCurrent')}</div>
    </div>
  </div>`;
}
function jumpTo(i){ SESSION.index=i; render_qBody(); if(SESSION.mode==='olympiad') startOlyTimer(); }

/* ============================== ADMIN ============================== */
let adminTab='add';
function viewAdmin(){
  const allBanks = [];
  SUBJECTS.forEach(s=> (TOPICS[s.id]||[]).forEach(tp=> allBanks.push({subj:s.id, topic:tp.id})));
  const customList = [];
  Object.keys(STATE.custom.questions).forEach(bk=>{
    STATE.custom.questions[bk].forEach(q=> customList.push({bk, q}));
  });

  return `<div class="container">
    <div class="section-head"><h2>⚙️ ${t('adminTitle')}</h2><p>${t('adminSub')}</p></div>
    <div class="tabs">
      <button class="${adminTab==='add'?'active':''}" onclick="setAdminTab('add')">${t('adminAddQ')}</button>
      <button class="${adminTab==='list'?'active':''}" onclick="setAdminTab('list')">${t('adminExisting')}</button>
      <button class="${adminTab==='stats'?'active':''}" onclick="setAdminTab('stats')">${t('adminStatsTitle')}</button>
    </div>

    ${adminTab==='add' ? `
    <div class="setup-card" style="max-width:640px;">
      <p class="helptext" style="margin-bottom:16px;">${t('adminNote')}</p>
      <div class="grid2">
        <div class="field"><label>${t('adminSubject')}</label>
          <select id="adSubj" onchange="refreshAdminTopics()">${SUBJECTS.map(s=>`<option value="${s.id}">${subjName(s.id,L())}</option>`).join('')}</select>
        </div>
        <div class="field"><label>${t('adminTopic')}</label>
          <select id="adTopic"></select>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>${t('adminType')}</label>
          <select id="adType" onchange="refreshAdminForm()">
            <option value="single">${t('typeSingle')}</option>
            <option value="truefalse">${t('typeTrue')}</option>
            <option value="text">${t('typeText')}</option>
          </select>
        </div>
        <div class="field"><label>${t('adminDiff')}</label>
          <select id="adDiff">
            <option value="easy">${t('diff_easy')}</option>
            <option value="medium" selected>${t('diff_medium')}</option>
            <option value="hard">${t('diff_hard')}</option>
            <option value="olympiad">${t('diff_olympiad')}</option>
          </select>
        </div>
      </div>
      <div class="field"><label>${t('adminPrompt')}</label><textarea id="adPrompt"></textarea></div>
      <div id="adTypeFields"></div>
      <div class="field"><label>${t('adminExplain')}</label><textarea id="adExpl"></textarea></div>
      <button class="btn btn-primary" onclick="addAdminQuestion()">${t('adminAddBtn')}</button>
    </div>
    ` : ''}

    ${adminTab==='list' ? `
      ${customList.length===0? `<p style="color:var(--ink-soft);">${t('adminEmpty')}</p>` : `
      <table class="admin-tbl"><thead><tr><th>${t('adminSubject')}/${t('adminTopic')}</th><th>${t('adminPrompt')}</th><th>${t('adminType')}</th><th></th></tr></thead>
      <tbody>${customList.map(({bk,q})=>{
        const [subj,topic]=bk.split(':');
        return `<tr><td>${subjName(subj,L())} / ${TOPIC_I18N[topic]?TOPIC_I18N[topic][L()]:topic}</td><td>${esc(q.prompt[L()]||q.prompt.kk||'')}</td><td>${q.type}</td><td><button class="btn btn-danger btn-sm" onclick="deleteAdminQuestion('${bk}','${q.id}')">${t('adminDelete')}</button></td></tr>`;
      }).join('')}</tbody></table>`}
    ` : ''}

    ${adminTab==='stats' ? `
      <div class="panel">
        <h3>${t('adminStatsTitle')}</h3>
        <div class="bar-row"><div class="name">${t('totalTasks')}</div><div class="bar-track"><div class="bar-fill" style="width:100%;background:var(--primary);"></div></div><div class="pct">${STATE.sessions.reduce((a,s)=>a+s.total,0)}</div></div>
        <div class="bar-row"><div class="name">${t('sessionsDone')}</div><div class="bar-track"><div class="bar-fill" style="width:100%;background:var(--accent);"></div></div><div class="pct">${STATE.sessions.length}</div></div>
        <p class="helptext" style="margin-top:10px;">${({kk:'Толық оқушылар статистикасы кейінгі нұсқада қосылады.',ru:'Полная статистика учеников будет доступна в следующей версии.',en:'Full student statistics will be available in a future version.'})[L()]}</p>
      </div>
    ` : ''}
  </div>`;
}
function setAdminTab(tab){ adminTab=tab; render(); setTimeout(()=>{ if(tab==='add'){ refreshAdminTopics(); refreshAdminForm(); } },0); }
function refreshAdminTopics(){
  const subj = document.getElementById('adSubj').value;
  const sel = document.getElementById('adTopic');
  const topics = TOPICS[subj]||[];
  sel.innerHTML = topics.map(tp=>`<option value="${tp.id}">${TOPIC_I18N[tp.id][L()]}</option>`).join('');
}
function refreshAdminForm(){
  const type = document.getElementById('adType').value;
  const el = document.getElementById('adTypeFields');
  if(type==='single'){
    el.innerHTML = `
      <div class="grid2">
        <div class="field"><label>${t('adminOptA')}</label><input type="text" id="adOptA"></div>
        <div class="field"><label>${t('adminOptB')}</label><input type="text" id="adOptB"></div>
        <div class="field"><label>${t('adminOptC')}</label><input type="text" id="adOptC"></div>
        <div class="field"><label>${t('adminOptD')}</label><input type="text" id="adOptD"></div>
      </div>
      <div class="field"><label>${t('adminCorrect')}</label>
        <select id="adCorrect"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
      </div>`;
  } else if(type==='truefalse'){
    el.innerHTML = `<div class="field"><label>${t('adminCorrect')}</label>
      <select id="adCorrectTF"><option value="true">True</option><option value="false">False</option></select></div>`;
  } else {
    el.innerHTML = `<div class="field"><label>${t('adminCorrect')}</label><input type="text" id="adCorrectText"></div>`;
  }
}
function addAdminQuestion(){
  const subj = document.getElementById('adSubj').value;
  const topic = document.getElementById('adTopic').value;
  const type = document.getElementById('adType').value;
  const diff = document.getElementById('adDiff').value;
  const promptTxt = document.getElementById('adPrompt').value.trim();
  const explTxt = document.getElementById('adExpl').value.trim();
  if(!promptTxt){ showToast(t('adminPrompt')); return; }
  const lang = L();
  const mkTri = (txt)=>({kk:txt,ru:txt,en:txt, [lang]:txt});
  let q = {id:'c'+Date.now(), type, diff, prompt:mkTri(promptTxt), expl:mkTri(explTxt||'—')};
  if(type==='single'){
    const opts = ['adOptA','adOptB','adOptC','adOptD'].map(id=>document.getElementById(id).value.trim()).filter(Boolean);
    if(opts.length<2){ showToast(t('adminOptA')+' / '+t('adminOptB')); return; }
    q.options = opts.map(o=>mkTri(o));
    q.correct = Math.min(parseInt(document.getElementById('adCorrect').value,10), opts.length-1);
  } else if(type==='truefalse'){
    q.correct = document.getElementById('adCorrectTF').value==='true';
  } else {
    const ans = document.getElementById('adCorrectText').value.trim();
    if(!ans){ showToast(t('adminCorrect')); return; }
    q.accept = [ans];
  }
  const bankKey = subj+':'+topic;
  if(!STATE.custom.questions[bankKey]) STATE.custom.questions[bankKey] = [];
  STATE.custom.questions[bankKey].push(q);
  saveState();
  showToast(t('savedToast'));
  document.getElementById('adPrompt').value=''; document.getElementById('adExpl').value='';
}
function deleteAdminQuestion(bankKey, qid){
  STATE.custom.questions[bankKey] = (STATE.custom.questions[bankKey]||[]).filter(q=>q.id!==qid);
  saveState(); render();
}

/* ============================== INIT / MISC ============================== */
function bindGlobalHandlers(){
  if(adminTab && location.hash.indexOf('admin')>=0){
    setTimeout(()=>{ if(document.getElementById('adSubj')){ refreshAdminTopics(); refreshAdminForm(); } },0);
  }
  if(SESSION && SESSION.mode==='olympiad' && location.hash.indexOf('session')>=0){
    startOlyTimer();
  }
}
    </script>
